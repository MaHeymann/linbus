# Expected to FAIL `esphome config`: uart_port must be one of UART_NUM_0/1/2 (UPGRADES.md H6).
esphome:
  name: linbus-test-uart-invalid

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components: [linbus]

logger:
  level: DEBUG

linbus:
  id: lin_master
  tx_pin: GPIO10
  rx_pin: GPIO6
  baud_rate: 19200
  uart_port: UART_NUM_9
  mode: master
