esphome:
  name: linbus-test-esp32c6

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components: [linbus]

logger:
  level: DEBUG

linbus:
  id: lin_master
  tx_pin: GPIO4
  rx_pin: GPIO5
  cs_pin: GPIO6
  baud_rate: 19200
  uart_port: UART_NUM_1
  mode: master
  schedule:
    - lin_id: 52
      interval: 100ms
  responses:
    - lin_id: 52
      data: [0x00, 0x80, 0x01]
      checksum: enhanced
